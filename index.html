<body>
<div id="app"></div>
<div id="modal-root"></div>
<div id="toast" role="status" aria-live="polite"></div>
<script>
/* Property Atlas | zero-dependency South African property modelling application */
'use strict';
const STORE_KEY='property-atlas-store-v1';
const TODAY=()=>new Date().toISOString().slice(0,10);
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const n=v=>Number.isFinite(Number(v))?Number(v):0;
const nonneg=v=>Math.max(0,n(v));
const numFmt=new Intl.NumberFormat('en-ZA',{maximumFractionDigits:0});
const money=v=>'R '+(v<0?'-':'')+numFmt.format(Math.abs(Math.round(n(v))));
const shortMoney=v=>Math.abs(v)>=1e6?'R '+(v/1e6).toFixed(2)+'m':Math.abs(v)>=1e3?'R '+(v/1e3).toFixed(0)+'k':money(v);
const pct=v=>(Number.isFinite(v)?v.toFixed(1)+'%':'—');
const signedClass=v=>n(v)<-0.01?'negative':n(v)>0.01?'positive':'neutral';
const uuid=()=>{if(globalThis.crypto?.randomUUID)return crypto.randomUUID();return 'p-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2)};
const initState=()=>({version:1,owners:['My portfolio'],properties:[],settings:{prime:10.5,inflation:4.3,defaultGrowth:6,defaultEscalation:7,projectionYears:15},updatedAt:TODAY()});
let state;try{state=JSON.parse(localStorage.getItem(STORE_KEY)||'null')||initState()}catch{state=initState()}
if(!Array.isArray(state.properties)||!state.settings)state=initState();
let ui={page:'dashboard',year:0,tab:'value',timelineMetric:'cashflow',compareMode:'snapshots',portfolioMode:'snapshot',selectedIds:new Set(),compareStatus:'all',search:'',selectionActive:false,detailId:null,trackType:'valuations',modal:null,step:0,formDraft:null,editId:null};
let toastTimer;
function persist(){state.updatedAt=TODAY();try{localStorage.setItem(STORE_KEY,JSON.stringify(state))}catch(e){notify('Local storage is full or disabled. Export a backup.')} }
function notify(message){const t=$('toast');t.textContent=message;t.className='toast visible';clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.className='toast',3200)}
function dateShift(date,months){const d=new Date((date||TODAY())+'T12:00:00');if(!Number.isFinite(d.getTime()))return TODAY();const day=d.getDate();d.setDate(1);d.setMonth(d.getMonth()+months);d.setDate(Math.min(day,new Date(d.getFullYear(),d.getMonth()+1,0).getDate()));return d.toISOString().slice(0,10)}
const monthDiff=(date1,date2)=>{const a=new Date((date1||TODAY())+'T12:00:00'),b=new Date((date2||TODAY())+'T12:00:00');if(!Number.isFinite(a.getTime())||!Number.isFinite(b.getTime()))return 0;return (b.getFullYear()-a.getFullYear())*12+(b.getMonth()-a.getMonth());};
const yearDiff=(a,b)=>monthDiff(a,b)/12;
const futureDate=offset=>dateShift(TODAY(),offset*12);
function loanPayment(balance,annualRate,months){if(balance<=0||months<=0)return 0;const r=annualRate/1200;return r===0?balance/months:(balance*r)/(1-Math.pow(1+r,-months))}
function apr(p){return p.rateType==='fixed'?nonneg(p.fixedRate):nonneg(n(state.settings.prime)+n(p.primeDeviation))}
function originalLoan(p){return p.bonded===false?0:Math.max(0,n(p.purchasePrice)-n(p.deposit)+n(p.initiationFees))}
function mortgageAt(p,target){if(p.bonded===false||!n(p.purchasePrice))return {balance:0,payment:0,remainingMonths:0,rate:0};const rate=apr(p),start=p.bondDate||p.purchaseDate||TODAY(),initial=originalLoan(p),term=Math.max(1,Math.round(n(p.bondYears||20)*12));let balance=initial;let months=monthDiff(start,target);const updates=(p.bondUpdates||[]).filter(x=>x.date<=target).sort((a,b)=>a.date.localeCompare(b.date));let anchor=start;for(const x of updates){if(x.date<start)continue;const step=Math.max(0,Math.min(term,monthDiff(anchor,x.date)));const fixed=n(p.actualRepayment)>0?n(p.actualRepayment):loanPayment(balance,rate,Math.max(1,term-monthDiff(start,anchor)));for(let i=0;i<step;i++)balance=Math.max(0,balance*(1+rate/1200)-fixed);balance=Math.max(0,n(x.balance));anchor=x.date}
months=Math.max(0,monthDiff(anchor,target));const remaining=Math.max(0,term-monthDiff(start,anchor));const scheduled=n(p.actualRepayment)>0?n(p.actualRepayment):loanPayment(balance,rate,Math.max(1,remaining));for(let i=0;i<Math.min(months,600);i++)balance=Math.max(0,balance*(1+rate/1200)-scheduled);const left=Math.max(0,term-monthDiff(start,target));const monthly=n(p.actualRepayment)>0?n(p.actualRepayment):loanPayment(balance,rate,Math.max(1,left));return {balance,payment:balance<1?0:monthly,remainingMonths:left,rate}}
function valueAt(p,target){const baseDate=p.purchaseDate||TODAY(),valuations=(p.valuations||[]).filter(x=>x.date<=target).sort((a,b)=>a.date.localeCompare(b.date));let anchor=baseDate,base=n(p.initialValue||p.purchasePrice);if(valuations.length){anchor=valuations.at(-1).date;base=n(valuations.at(-1).value)}const growth=n(p.expectedGrowth??state.settings.defaultGrowth);return Math.max(0,base*Math.pow(1+growth/100,yearDiff(anchor,target)))}
function metric(p,offset=0){const target=futureDate(offset);const base=TODAY();const years=yearDiff(base,target);const infl=Math.pow(1+n(state.settings.inflation)/100,years);const rent=n(p.rent)*Math.pow(1+n(p.escalation??state.settings.defaultEscalation)/100,years);const letting=rent*n(p.agentPct)/100;const mortgage=mortgageAt(p,target);const levy=n(p.levy)*infl,rates=n(p.rates)*infl,maintenance=n(p.maintenance)*infl,other=n(p.otherExpense)*infl,admin=mortgage.balance>0?n(p.adminFee):0;const outgoings=mortgage.payment+levy+rates+maintenance+other+admin;const income=rent-letting,expenses=outgoings+letting,cf=income-outgoings;const value=valueAt(p,target),bond=mortgage.balance,equity=value-bond,capitalGrowth=value-n(p.purchasePrice);const gross= mortgage.payment>0?rent/mortgage.payment*100:(rent>0?Infinity:0);const net=outgoings>0?income/outgoings*100:(income>0?Infinity:0);const tracked=(p.transactions||[]).filter(x=>x.date<=target).reduce((s,x)=>s+(x.kind==='income'?1:-1)*n(x.amount),0);let invested=nonneg(p.deposit)+nonneg(p.transferCost)+nonneg(p.transferDuty)+nonneg(p.renovations)+nonneg(p.otherInitial)+(p.bonded===false?n(p.purchasePrice):0)+Math.max(0,-tracked);let returns=equity+Math.max(0,tracked);if(offset>0){for(let i=0;i<offset;i++){const sim=metricCF(p,i);const tot=sim*12;if(tot<0)invested-=tot;else returns+=tot}}const profit=returns-invested,roi=invested>0?(profit/invested*100):0;return {target,rent,letting,levy,rates,maintenance,other,admin,repayment:mortgage.payment,outgoings,expenses,income,cf,value,bond,equity,gross,net,invested,returns,profit,roi,capitalGrowth,rate:mortgage.rate,remainingMonths:mortgage.remainingMonths,size:n(p.size),priceSqm:n(p.size)>0?value/n(p.size):0,rentValue:value>0?(rent*12/value)*100:0,growth:n(p.expectedGrowth),escalation:n(p.escalation),lettingPct:n(p.agentPct)} }
function metricCF(p,offset){const target=futureDate(offset),years=yearDiff(TODAY(),target),infl=Math.pow(1+n(state.settings.inflation)/100,years),rent=n(p.rent)*Math.pow(1+n(p.escalation??state.settings.defaultEscalation)/100,years),loan=mortgageAt(p,target);return rent*(1-n(p.agentPct)/100)-loan.payment-n(p.adminFee)*(loan.balance>0?1:0)-(n(p.levy)+n(p.rates)+n(p.maintenance)+n(p.otherExpense))*infl;}
function portfolio(props,year=0){const vals=props.map(p=>metric(p,year));const total=k=>vals.reduce((s,v)=>s+(Number.isFinite(v[k])?v[k]:0),0);const income=total('income'),out=total('outgoings'),rep=total('repayment'),rent=total('rent');return {count:props.length,value:total('value'),bond:total('bond'),equity:total('equity'),rent,income,outgoings:out,expenses:total('expenses'),cf:total('cf'),invested:total('invested'),returns:total('returns'),profit:total('profit'),roi:total('invested')?total('profit')/total('invested')*100:0,gross:rep?rent/rep*100:0,net:out?income/out*100:0,gearing:total('value')?total('bond')/total('value')*100:0,levy:total('levy'),rates:total('rates'),letting:total('letting'),maintenance:total('maintenance'),other:total('other'),admin:total('admin'),repayment:rep,capitalGrowth:total('capitalGrowth')}}
const owned=()=>state.properties.filter(p=>p.status==='owned');
const wished=()=>state.properties.filter(p=>p.status==='wishlist');
const comparison=()=>state.properties.filter(p=>ui.compareStatus==='all'||p.status===ui.compareStatus).filter(p=>!ui.selectionActive||ui.selectedIds.has(p.id));
const propertyName=p=>p.name||(p.complexName?[p.complexName,p.unit].filter(Boolean).join(' · '):[p.streetNumber,p.street].filter(Boolean).join(' '))||'Untitled property';

function chartBars(labels,series,{height=265,percent=false}={}){if(!labels.length)return `<div class="empty">Add a property to display a chart.</div>`;const W=960,H=height,L=72,R=25,T=24,B=58,plotW=W-L-R,plotH=H-T-B;const values=series.flatMap(s=>s.values.map(x=>Number.isFinite(x)?x:0));const top=Math.max(1,...values,0),bottom=Math.min(0,...values);const pad=(top-bottom)*.12||1;const max=top+pad,min=bottom>=0?0:Math.min(0,bottom-pad);const y=v=>T+(max-v)/(max-min)*plotH;let svg=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Comparison chart" preserveAspectRatio="xMidYMid meet">`;for(let t=0;t<=5;t++){const val=min+(max-min)*t/5,yy=y(val);svg+=`<line class="chart-gridline" x1="${L}" x2="${W-R}" y1="${yy}" y2="${yy}"/><text class="chart-axis" x="${L-9}" y="${yy+4}" text-anchor="end">${percent?val.toFixed(0)+'%':shortMoney(val)}</text>`}const base=y(0),group=plotW/labels.length;const bw=Math.min(31,(group*.77)/Math.max(1,series.length));labels.forEach((label,i)=>{const mid=L+group*(i+.5);series.forEach((s,j)=>{const val=Number.isFinite(s.values[i])?s.values[i]:0;const xx=mid-(series.length*bw)/2+j*bw+2,yy=y(val),rh=Math.max(1,Math.abs(base-yy));svg+=`<rect x="${xx}" y="${Math.min(yy,base)}" width="${Math.max(2,bw-4)}" height="${rh}" rx="2" fill="${s.color}" opacity=".94"><title>${esc(label)} — ${esc(s.name)}: ${percent?ratio(val):money(val)}</title></rect>`});const cut=label.length>20?label.slice(0,19)+'…':label;svg+=`<text class="chart-label" text-anchor="middle" x="${mid}" y="${H-26}">${esc(cut)}</text>`});svg+=`</svg>`;return `<div class="chart-frame">${svg}</div><div class="legend">${series.map(s=>`<span><b style="background:${s.color}"></b>${esc(s.name)}</span>`).join('')}</div>`}
function chartLine(labels,series,{height=270,percent=false}={}){if(!series.length||!labels.length)return `<div class="empty">No data to chart.</div>`;const W=960,H=height,L=76,R=23,T=22,B=48,plotW=W-L-R,plotH=H-T-B;const values=series.flatMap(s=>s.values.filter(Number.isFinite));const max=Math.max(1,...values,0),min=Math.min(0,...values),range=max-min||1;const pad=range*.11,lo=min-pad,hi=max+pad;const y=v=>T+(hi-v)/(hi-lo)*plotH,xx=i=>L+i/(labels.length-1||1)*plotW;let svg=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Financial projection line chart">`;for(let k=0;k<=5;k++){const v=lo+(hi-lo)*k/5,cy=y(v);svg+=`<line class="chart-gridline" x1="${L}" x2="${W-R}" y1="${cy}" y2="${cy}"/><text x="${L-9}" y="${cy+3}" class="chart-axis" text-anchor="end">${percent?v.toFixed(0)+'%':shortMoney(v)}</text>`}labels.forEach((label,i)=>{if(i%Math.max(1,Math.ceil(labels.length/8))===0||i===labels.length-1)svg+=`<text x="${xx(i)}" y="${H-16}" class="chart-label" text-anchor="middle">${esc(label)}</text>`});series.forEach(s=>{const coords=s.values.map((v,i)=>[xx(i),y(Number.isFinite(v)?v:0)]);svg+=`<polyline fill="none" stroke="${s.color}" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round" points="${coords.map(x=>x.join(',')).join(' ')}"/>`;coords.forEach(([cx,cy],i)=>{svg+=`<circle cx="${cx}" cy="${cy}" r="3" fill="${s.color}"><title>${esc(s.name)}, ${esc(labels[i])}: ${percent?ratio(s.values[i]):money(s.values[i])}</title></circle>`})});return `<div class="chart-frame">${svg}</div><div class="legend">${series.map(s=>`<span><b style="background:${s.color}"></b>${esc(s.name)}</span>`).join('')}</div>`}

s+=`<div class="grid grid-2 section"><section class="card"><div class="card-head"><h2 class="card-title">Cash-flow ledger</h2><label class="fine">Actual entries, not forecasts</label></div>${table(['Date','Property','Type','Amount','Memo'],state.properties.flatMap(p=>(p.transactions||[]).map(x=>({...x,p}))).sort((a,b)=>b.date.localeCompare(a.date)).slice(0,30).map(x=>row([esc(x.date),nameLink(x.p),x.kind==='income'?'<span class="positive">Income</span>':'<span class="negative">Expense</span>',moneyCell((x.kind==='income'?1:-1)*n(x.amount),true),esc(x.note||'—')])))}</section><section class="card"><div class="card-head"><h2 class="card-title">How tracking works</h2></div><p><strong>Valuations</strong> become the starting point for subsequent capital-growth projections.</p><p><strong>Bond balance updates</strong> replace the mortgage balance on their recorded date, then amortisation continues from that new balance.</p><p><strong>Cash entries</strong> are a separate actual-income ledger. They affect realised returns but do not overwrite monthly rental assumptions.</p><p class="muted">Use the property details page to review and delete individual entries.</p></section></div>`;return s}
function settingsPage(){const x=state.settings;let s=header('Settings & backups','Adjust macro assumptions, change ownership labels and keep a portable copy of your data.','new-property');s+=`<div class="grid grid-2"><section class="card"><h2 class="card-title">Market assumptions</h2><p class="card-subtitle">Applied to new properties and adjustable-rate mortgages, unless overridden.</p><form id="settings-form"><div class="form-grid">${field('South African prime rate (%)','prime',x.prime,'number','step="0.01" min="0"')}${field('Annual inflation (%)','inflation',x.inflation,'number','step="0.01"')}${field('Default annual capital growth (%)','defaultGrowth',x.defaultGrowth,'number','step="0.01"')}${field('Default annual rent escalation (%)','defaultEscalation',x.defaultEscalation,'number','step="0.01"')}${field('Forecast horizon (years)','projectionYears',x.projectionYears,'number','min="1" max="30"')}</div><div style="margin-top:18px"><button class="btn btn-primary" type="submit">Save assumptions</button></div></form></section><section class="card"><h2 class="card-title">Data management</h2><p class="card-subtitle">Your records are stored in this browser on this device. Hosting the site does not sync your data.</p><div class="stat-list">${stat('Properties',state.properties.length)}${stat('Last saved',esc(state.updatedAt||'—'))}${stat('Data format','JSON · Version 1')}</div><div class="inline-controls" style="margin-top:18px">${button('↓ Export backup','export-json','btn btn-primary')}${button('↓ Export CSV','export-csv','btn')}${button('↑ Import backup','import-json','btn')}</div><input id="import-file" type="file" accept="application/json,.json" hidden/><hr class="divider"/><div class="insight">If you clear browser storage, use another browser, or change devices, your locally stored records will not follow you. Regularly export a backup.</div><div style="margin-top:18px">${button('Reset all data','reset-data','btn btn-danger btn-small')}</div></section></div>`;
s+=`<section class="card section"><div class="card-head"><h2 class="card-title">Property owners</h2>${button('+ Add owner','add-owner','btn btn-small')}</div><div class="inline-controls">${state.owners.map(x=>`<span class="toggle-tag">${esc(x)}</span>`).join('')}</div><p class="hint">Owner labels help you classify properties without creating separate accounts.</p></section>`;return s}
function detailPage(){const p=state.properties.find(p=>p.id===ui.detailId);if(!p){ui.page='properties';return propertiesPage()}const v=metric(p),a=propertyAddr(p);let s=`<div class="detail-header"><div>${button('← All properties','goto-properties','btn btn-small')}<div class="eyebrow" style="margin-top:15px">${esc(p.status==='wishlist'?'Potential investment':'Current investment')} · ${esc(p.owner||'My portfolio')}</div><h1 style="margin:2px 0 6px">${esc(propertyName(p))}</h1><div class="muted">${esc(a||'Address not provided')}</div></div><div class="inline-controls">${button('Edit property','edit-property','btn',`data-id="${p.id}"`)}${button('Delete','delete-property','btn btn-danger',`data-id="${p.id}"`)}</div></div>`;
s+=`<div class="grid grid-4">${labelValue('Market value',money(v.value),`${pct(v.growth)} expected growth`)}${labelValue('Outstanding bond',money(v.bond),`${pct(v.rate)} interest rate`)}${labelValue('Equity',`<span class="${signedClass(v.equity)}">${money(v.equity)}</span>`,`${pct(v.value?v.equity/v.value*100:0)} equity share`)}${labelValue('Monthly cash flow',`<span class="${signedClass(v.cf)}">${money(v.cf)}</span>`,`${ratio(v.net)} net coverage`)}</div>`;
s+=`<div class="two-panel section"><div class="card"><div class="card-head"><h2 class="card-title">15-year property projection</h2></div>${chartLine(Array.from({length:16},(_,i)=>i?'Year '+i:'Current'),[{name:'Value',color:'#68a77b',values:Array.from({length:16},(_,i)=>metric(p,i).value)},{name:'Bond',color:'#28574c',values:Array.from({length:16},(_,i)=>metric(p,i).bond)},{name:'Equity',color:'#5678ad',values:Array.from({length:16},(_,i)=>metric(p,i).equity)}])}</div><div class="card"><h2 class="card-title">Property summary</h2><div class="stat-list">${stat('Property type',esc(p.type||'Residential'))}${stat('Bedrooms / bathrooms',`${n(p.bedrooms)||'—'} / ${n(p.bathrooms)||'—'}`)}${stat('Area',p.size?esc(p.size)+' m²':'—')}${stat('Floor',esc(p.floor||'—'))}${stat('Purchase date',esc(p.purchaseDate||'—'))}${stat('Purchase price',money(p.purchasePrice))}${stat('Owner',esc(p.owner||'—'))}${stat('Status',`<span class="status ${p.status==='wishlist'?'wishlist':''}">${p.status==='wishlist'?'Wish list':'Owned'}</span>`)}</div></div></div>`;
s+=`<div class="grid grid-3 section"><div class="card"><h2 class="card-title">Mortgage</h2><div class="stat-list">${stat('Original balance',money(originalLoan(p)))}${stat('Interest',pct(apr(p)))}${stat('Repayment',money(v.repayment))}${stat('Remaining term',Math.floor(v.remainingMonths/12)+' yr '+(v.remainingMonths%12)+' mo')}${stat('Bond administration',money(p.adminFee))}${stat('Loan-to-value',pct(v.value?v.bond/v.value*100:0))}</div><div style="margin-top:16px">${button('Record bond balance','new-bond-update','btn btn-small',`data-id="${p.id}"`)}</div></div><div class="card"><h2 class="card-title">Rent & expenses / month</h2><div class="stat-list">${stat('Gross rent',money(v.rent))}${stat('Agent commission',money(v.letting))}${stat('Bond repayment',money(v.repayment))}${stat('Levy',money(v.levy))}${stat('Rates and taxes',money(v.rates))}${stat('Maintenance and other',money(v.maintenance+v.other+v.admin))}${stat('Cash flow',moneyCell(v.cf,true))}</div></div><div class="card"><h2 class="card-title">Capital and return</h2><div class="stat-list">${stat('Deposit',money(p.deposit))}${stat('Transfer and purchase costs',money(n(p.transferCost)+n(p.transferDuty)+n(p.otherInitial)))}${stat('Renovations',money(p.renovations))}${stat('Invested capital',money(v.invested))}${stat('Returns',money(v.returns))}${stat('Total profit',moneyCell(v.profit,true))}${stat('ROI',pct(v.roi))}</div></div></div>`;
s+=`<div class="grid grid-2 section"><section class="card"><div class="card-head"><h2 class="card-title">Market valuations</h2>${button('+ Add valuation','new-valuation','btn btn-small',`data-id="${p.id}"`)}</div>${eventListing(p,'valuations',['Date','Value','Notes'],x=>[esc(x.date),money(x.value),esc(x.note||'—')])}</section><section class="card"><div class="card-head"><h2 class="card-title">Bond balance history</h2>${button('+ Add bond balance','new-bond-update','btn btn-small',`data-id="${p.id}"`)}</div>${eventListing(p,'bondUpdates',['Date','Outstanding balance','Notes'],x=>[esc(x.date),money(x.balance),esc(x.note||'—')])}</section></div>`;
s+=`<section class="card section"><div class="card-head"><h2 class="card-title">Actual cash-flow entries</h2>${button('+ Add cash entry','new-transaction','btn btn-small',`data-id="${p.id}"`)}</div>${eventListing(p,'transactions',['Date','Type','Amount','Notes'],x=>[esc(x.date),esc(x.kind),moneyCell(x.kind==='income'?x.amount:-x.amount,true),esc(x.note||'—')])}</section><section class="card section"><div class="card-head"><h2 class="card-title">Lease history</h2>${button('+ Add or renew lease','new-lease','btn btn-small',`data-id="${p.id}"`)}</div>${eventListing(p,'leases',['Date','Monthly rent','Agent commission','Term','Notes'],x=>[esc(x.date),money(x.rent),pct(x.agentPct),esc(x.term)+' months',esc(x.note||'—')])}</section>`;return s}
function eventListing(p,key,labels,format){const recs=(p[key]||[]).slice().sort((a,b)=>b.date.localeCompare(a.date));return table([...labels,''],recs.map(x=>row([...format(x),button('✕','delete-entry','btn btn-small btn-danger',`data-id="${p.id}" data-key="${key}" data-entry="${x.id}" aria-label="Delete entry"`)])))}
function shell(content){const nav=[['dashboard','◫','Dashboard'],['properties','⌂','Properties'],['compare','⇄','Compare'],['portfolio','▥','Portfolio'],['tracking','↗','Tracking'],['settings','⚙','Settings']];return `<div class="app-shell"><aside class="sidebar"><div class="brand"><div class="brand-icon">⌂</div><div>Property Atlas<small>INVESTMENT INTELLIGENCE</small></div></div><div class="nav-caption">Workspace</div><nav aria-label="Main navigation">${nav.map(([pg,ico,name])=>`<button class="nav-item ${ui.page===pg||(ui.page==='detail'&&pg==='properties')?'active':''}" data-action="nav" data-page="${pg}"><span class="nav-ico">${ico}</span>${name}</button>`).join('')}</nav><div class="side-bottom"><strong>Private by default</strong><br/>Saved locally in this browser.<br/>Export backups in Settings.</div></aside><main class="workspace"><div class="topline"><div class="breadcrumbs">PORTFOLIO <span>›</span> ${esc(ui.page==='detail'?'PROPERTY DETAILS':ui.page.toUpperCase())}</div><div class="top-actions">${button('↓ Backup','export-json','btn btn-small')}</div></div>${content}<footer class="fine" style="margin-top:34px">Property Atlas · Financial projections are estimates, not valuations or tax advice. Save a JSON backup before clearing browser data.</footer></main></div>`}
function render(){let html=ui.page==='dashboard'?dashboard():ui.page==='properties'?propertiesPage():ui.page==='compare'?comparisonPage():ui.page==='portfolio'?portfolioPage():ui.page==='tracking'?trackingPage():ui.page==='settings'?settingsPage():ui.page==='detail'?detailPage():dashboard();$('app').innerHTML=shell(html);if(ui.modal)renderModal()}
function field(label,key,value='',type='text',extra='',help=''){return `<div class="field"><label for="f-${key}">${esc(label)}</label><input id="f-${key}" name="${key}" type="${type}" value="${esc(value??'')}" ${extra}/>${help?`<small>${esc(help)}</small>`:''}</div>`}
function choice(label,key,options,value){return `<div class="field"><label for="f-${key}">${esc(label)}</label><select name="${key}" id="f-${key}">${options.map(([val,lbl])=>`<option value="${esc(val)}" ${String(val)===String(value)?'selected':''}>${esc(lbl)}</option>`).join('')}</select></div>`}
function modal(title,body,footer='',wide=''){ $('modal-root').innerHTML=`<div class="modal-shade" id="modal-backdrop"><section class="modal" role="dialog" aria-modal="true" aria-label="${esc(title)}" ${wide}><div class="modal-header"><h2>${esc(title)}</h2><button class="close-x" data-action="close-modal" aria-label="Close dialog">×</button></div>${body}${footer}</section></div>`}
function closeModal(){ui.modal=null;ui.formDraft=null;ui.editId=null;$('modal-root').innerHTML=''}
const baseProperty=()=>({id:uuid(),name:'',status:'owned',owner:state.owners[0]||'My portfolio',type:'Residential property',complexName:'',unit:'',streetNumber:'',street:'',suburb:'',city:'',bedrooms:2,bathrooms:1,size:0,floor:'Ground',purchaseDate:TODAY(),purchasePrice:0,initialValue:0,expectedGrowth:n(state.settings.defaultGrowth),transferCost:0,transferDuty:0,renovations:0,otherInitial:0,deposit:0,initiationFees:0,bonded:true,bondDate:TODAY(),bondYears:20,rateType:'variable',primeDeviation:0,fixedRate:n(state.settings.prime),actualRepayment:0,paymentDay:1,adminFee:0,rent:0,agentPct:7,escalation:n(state.settings.defaultEscalation),leaseTerm:12,remainingLease:12,levy:0,rates:0,maintenance:0,otherExpense:0,notes:'',valuations:[],bondUpdates:[],transactions:[],leases:[],createdAt:TODAY()});
function startWizard(id=null,desiredStatus=null){const p=id?state.properties.find(x=>x.id===id):null;ui.formDraft={...baseProperty(),...(p?structuredClone(p):{}),...(desiredStatus?{status:desiredStatus}:{})};ui.modal='wizard';ui.step=0;ui.editId=id;renderModal()}
function wizardStep(p,step){if(step===0)return `<div class="form-section"><h3>Identify the property</h3><div class="form-grid">${field('Property name / nickname','name',p.name,'text','placeholder="e.g. Riverside 12"','Optional if you provide an address or complex')}${choice('Portfolio list','status',[['owned','My current properties'],['wishlist','Property wish list']],p.status)}${choice('Property type','type',[['Residential property','Residential property'],['Apartment / sectional title','Apartment / sectional title'],['Freehold house','Freehold house'],['Commercial property','Commercial property'],['Land','Land'],['Other','Other']],p.type)}<div class="field"><label for="f-owner">Property owner</label><div class="inline-controls"> <select name="owner" id="f-owner" style="flex:1;min-width:110px">${state.owners.map(a=>`<option value="${esc(a)}" ${p.owner===a?'selected':''}>${esc(a)}</option>`).join('')}</select>${button('+ Owner','wizard-add-owner','btn btn-small')}</div></div>${field('Complex name','complexName',p.complexName,'text','placeholder="Optional"')}${field('Unit number','unit',p.unit,'text','placeholder="Optional"')}${field('Street number','streetNumber',p.streetNumber)}${field('Street','street',p.street)}${field('Suburb','suburb',p.suburb)}${field('City / town','city',p.city)}</div></div><div class="form-section"><h3>Property specifications</h3><div class="form-grid">${field('Bedrooms','bedrooms',p.bedrooms,'number','min="0"')}${field('Bathrooms','bathrooms',p.bathrooms,'number','min="0" step="0.5"')}${field('Size (m²)','size',p.size,'number','min="0" step="0.1"')}${choice('Floor','floor',[['Ground','Ground'],['1st','1st'],['2nd','2nd'],['3rd','3rd'],['Higher','Higher'],['Not applicable','Not applicable']],p.floor)}</div></div>`;
if(step===1)return `<div class="form-section"><h3>Purchase information</h3><div class="form-grid">${field('Purchase date','purchaseDate',p.purchaseDate,'date','required')}${field('Purchase price (R)','purchasePrice',p.purchasePrice,'number','min="0" step="0.01" required')}${field('Initial market value (R)','initialValue',p.initialValue,'number','min="0" step="0.01"','Leave zero to use the purchase price')}${field('Expected annual growth (%)','expectedGrowth',p.expectedGrowth,'number','step="0.1" min="-95" max="100"')}</div></div><div class="form-section"><h3>Initial purchase costs</h3><div class="form-grid">${field('Transfer cost / conveyancing (R)','transferCost',p.transferCost,'number','min="0" step="0.01"')}${field('Transfer duty (R)','transferDuty',p.transferDuty,'number','min="0" step="0.01"')}${field('Initial renovations (R)','renovations',p.renovations,'number','min="0" step="0.01"')}${field('Other initial costs (R)','otherInitial',p.otherInitial,'number','min="0" step="0.01"')}</div></div>`;
if(step===2)return `<div class="form-section"><h3>Initial bond details</h3><div class="form-grid">${choice('Mortgage financing','bonded',[['true','This property is bonded'],['false','This property is not bonded']],String(p.bonded!==false))}${field('Deposit (R)','deposit',p.deposit,'number','min="0" step="0.01"')}${field('Bond initiation fees financed (R)','initiationFees',p.initiationFees,'number','min="0" step="0.01"')}${field('Bond start date','bondDate',p.bondDate||p.purchaseDate,'date')}${field('Bond term (years)','bondYears',p.bondYears,'number','min="1" max="40"')}${choice('Interest rate type','rateType',[['variable','Variable (linked to prime)'],['fixed','Fixed interest rate']],p.rateType)}${field('Deviation from prime (percentage points)','primeDeviation',p.primeDeviation,'number','step="0.01"','Use -1 for prime minus 1%')}${field('Fixed annual interest rate (%)','fixedRate',p.fixedRate,'number','step="0.01" min="0"')}${field('Actual monthly repayment override (R)','actualRepayment',p.actualRepayment,'number','min="0" step="0.01"','Leave zero for calculated minimum repayment')}${field('Monthly administration fee (R)','adminFee',p.adminFee,'number','min="0" step="0.01"')}${field('Payment day of month','paymentDay',p.paymentDay,'number','min="1" max="31"')}</div></div><div class="insight">Calculated loan: purchase price minus deposit plus financed initiation fees. Current prime: ${pct(n(state.settings.prime))}. A deposit equal to the full purchase price means no borrowing.</div>`;
return `<div class="form-section"><h3>Current rental income & lease</h3><div class="form-grid">${field('Monthly rental income (R)','rent',p.rent,'number','min="0" step="0.01"')}${field('Letting / agent commission (%)','agentPct',p.agentPct,'number','min="0" max="100" step="0.1"')}${field('Next annual rent escalation (%)','escalation',p.escalation,'number','step="0.1" min="-90"')}${field('Lease term (months)','leaseTerm',p.leaseTerm,'number','min="0"')}${field('Remaining lease (months)','remainingLease',p.remainingLease,'number','min="0"')}</div></div><div class="form-section"><h3>Monthly operating expenses</h3><div class="form-grid">${field('Levy (R)','levy',p.levy,'number','min="0" step="0.01"')}${field('Rates & taxes (R)','rates',p.rates,'number','min="0" step="0.01"')}${field('Maintenance provision (R)','maintenance',p.maintenance,'number','min="0" step="0.01"')}${field('Other expenses (R)','otherExpense',p.otherExpense,'number','min="0" step="0.01"')}</div></div><div class="form-section"><h3>Notes</h3><div class="field"><label for="f-notes">Property notes</label><textarea id="f-notes" name="notes" rows="3" placeholder="Optional: tenant, lease details, purchase observations…">${esc(p.notes)}</textarea></div></div>`}
function renderModal(){if(ui.modal==='wizard'){const titles=['Property details','Purchase & valuation','Mortgage & interest','Income & expenses'],p=ui.formDraft;const body=`<div class="wizard-bar">${titles.map((t,i)=>`<div class="wizard-step ${i===ui.step?'current':i<ui.step?'done':''}">${i+1}. ${t}</div>`).join('')}</div><div class="modal-body"><form id="wizard-form">${wizardStep(p,ui.step)}</form></div>`;const foot=`<div class="modal-foot"><div>${ui.step===0?`<span class="fine">Step 1 of 4</span>`:button('← Back','wizard-back','btn')}</div><div class="inline-controls">${button('Cancel','close-modal','btn')}${button(ui.step===3?'Save property':'Continue →','wizard-next','btn btn-primary')}</div></div>`;modal(ui.editId?'Edit property':'Add a new property',body,foot);return}
if(ui.modal==='lease'){
const p=state.properties.find(x=>x.id===ui.leaseId)||state.properties[0];

modal('Add or renew a lease',`<div class="modal-body">${body}</div>`,`<div class="modal-foot">${button('Cancel','close-modal','btn')}${button('Save lease','save-lease','btn btn-primary')}</div>`);return}
if(ui.modal==='event'){const {eventType,propertyId}=ui.eventDraft,props=state.properties;const opts=props.map(p=>[p.id,propertyName(p)]);const key=eventType==='valuation'?'value':eventType==='bond'?'balance':'amount';const title=eventType==='valuation'?'Record property valuation':eventType==='bond'?'Record outstanding bond balance':'Record actual cash transaction';const fields=`<form id="event-form"><div class="form-grid">${choice('Property','propertyId',opts,propertyId||props[0]?.id)}${field('Record date','date',TODAY(),'date','required')}${eventType==='transaction'?choice('Transaction type','kind',[['income','Rental / other income'],['expense','Operating / other expense']],'income'):''}${field(eventType==='valuation'?'Market valuation (R)':eventType==='bond'?'Outstanding bond balance (R)':'Amount (R)',key,0,'number','min="0" step="0.01" required')}<div class="field field-wide"><label for="f-note">Notes / source</label><input id="f-note" name="note" placeholder="${eventType==='valuation'?'e.g. Agent valuation or professional appraisal':eventType==='bond'?'e.g. Bank mortgage statement':'e.g. November rental payment'}" /></div></div></form>`;modal(title,`<div class="modal-body">${fields}</div>`,`<div class="modal-foot">${button('Cancel','close-modal','btn')}${button('Save record','save-event','btn btn-primary')}</div>`);return}
if(ui.modal==='owner'){modal('Add property owner',`<div class="modal-body"><form id="owner-form">${field('Owner display name','ownerName','','text','required placeholder="e.g. Example owner"')}</form></div>`,`<div class="modal-foot">${button('Cancel','close-modal','btn')}${button('Add owner','save-owner','btn btn-primary')}</div>`);return}
if(ui.modal==='confirm'){const d=ui.confirm;modal(d.title,`<div class="modal-body"><p>${esc(d.message)}</p><p class="negative"><strong>This action cannot be undone without restoring a backup.</strong></p></div>`,`<div class="modal-foot">${button('Cancel','close-modal','btn')}${button('Delete permanently','confirm-delete','btn btn-danger')}</div>`)} }
const NUM_FIELDS=new Set(['bedrooms','bathrooms','size','purchasePrice','initialValue','expectedGrowth','transferCost','transferDuty','renovations','otherInitial','deposit','initiationFees','bondYears','primeDeviation','fixedRate','actualRepayment','paymentDay','adminFee','rent','agentPct','escalation','leaseTerm','remainingLease','levy','rates','maintenance','otherExpense']);
function saveStep(){const f=$('wizard-form');if(!f)return false;if(!f.reportValidity())return false;for(const [k,v] of new FormData(f)){ui.formDraft[k]=NUM_FIELDS.has(k)?n(v):k==='bonded'?(v==='true'):String(v)}return true}
function nextWizard(){if(!saveStep())return;if(ui.step===0&&!String(ui.formDraft.name||ui.formDraft.complexName||ui.formDraft.street).trim()){notify('Enter a property name, complex or street address.');return}if(ui.step===1&&!n(ui.formDraft.purchasePrice)){notify('Enter a purchase price greater than zero.');return}if(ui.step<3){ui.step++;renderModal();return}const p=ui.formDraft;if(!n(p.initialValue))p.initialValue=n(p.purchasePrice);if(!p.bondDate)p.bondDate=p.purchaseDate;if(p.deposit>p.purchasePrice){notify('Deposit cannot exceed the property purchase price.');return}if(p.bonded===false){p.deposit=n(p.purchasePrice);p.initiationFees=0}const idx=state.properties.findIndex(x=>x.id===p.id);if(idx>=0)state.properties[idx]=p;else state.properties.push(p);persist();closeModal();ui.page='detail';ui.detailId=p.id;render();notify(idx>=0?'Property updated':'Property saved successfully')}
function startLease(propertyId=null){if(!state.properties.length){notify('Add a property first');return}ui.modal='lease';ui.leaseId=propertyId;renderModal()}
function saveLease(){const form=$('lease-form');if(!form?.reportValidity())return;const v=Object.fromEntries(new FormData(form)),p=state.properties.find(x=>x.id===v.propertyId);if(!p)return;for(const k of ['rent','agentPct','escalation','leaseTerm','remainingLease'])p[k]=n(v[k]);p.leases=p.leases||[];p.leases.push({id:uuid(),date:v.date,rent:p.rent,agentPct:p.agentPct,escalation:p.escalation,term:p.leaseTerm,remaining:p.remainingLease,note:v.note||''});persist();closeModal();render();notify('Lease details saved')}
function startEvent(eventType,propertyId=null){if(!state.properties.length){notify('Add a property before recording its history.');return}ui.modal='event';ui.eventDraft={eventType,propertyId};renderModal()}
function saveEvent(){const form=$('event-form');if(!form?.reportValidity())return;const f=Object.fromEntries(new FormData(form)),p=state.properties.find(x=>x.id===f.propertyId);if(!p){notify('Select a valid property');return}const fieldName=ui.eventDraft.eventType==='valuation'?'value':ui.eventDraft.eventType==='bond'?'balance':'amount';if(n(f[fieldName])<=0&&ui.eventDraft.eventType!=='bond'){notify('Enter an amount greater than zero.');return}const name=ui.eventDraft.eventType==='valuation'?'valuations':ui.eventDraft.eventType==='bond'?'bondUpdates':'transactions';p[name].push({id:uuid(),date:f.date,note:f.note||'',...(name==='transactions'?{amount:n(f.amount),kind:f.kind}:name==='valuations'?{value:n(f.value)}:{balance:n(f.balance)})});persist();closeModal();render();notify('Record saved')}
function download(filename,text,type='application/json'){const blob=new Blob([text],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=filename;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),5000)}
function exportJSON(){download('property-atlas-backup-'+TODAY()+'.json',JSON.stringify(state,null,2))}
function csvValue(x){return '"'+String(x??'').replace(/"/g,'""')+'"'}
function exportCSV(){const cols=['Property','Status','Owner','Suburb','City','Beds','Baths','Size m2','Purchase price','Market value','Bond','Equity','Rent per month','Agent commission','Bond repayment','Levy','Rates','Maintenance','Other expenses','Monthly cash flow','Gross coverage %','Net coverage %','Annual growth %','Annual rent escalation %','ROI %'];const rows=state.properties.map(p=>{const v=metric(p);return [propertyName(p),p.status,p.owner,p.suburb,p.city,p.bedrooms,p.bathrooms,p.size,p.purchasePrice,v.value,v.bond,v.equity,v.rent,v.letting,v.repayment,v.levy,v.rates,v.maintenance,v.other,v.cf,v.gross,v.net,v.growth,v.escalation,v.roi]});download('property-atlas-summary-'+TODAY()+'.csv','\ufeff'+[cols,...rows].map(r=>r.map(csvValue).join(',')).join('\r\n'),'text/csv;charset=utf-8')}
function importJSON(input){const file=input.files?.[0];if(!file)return;const reader=new FileReader();reader.onload=()=>{try{const obj=JSON.parse(reader.result);if(!obj||obj.version!==1||!Array.isArray(obj.properties)||!obj.settings||!Array.isArray(obj.owners))throw Error('Invalid Property Atlas backup format');if(!confirm('Importing will replace all current data in this browser. Export a backup first if needed. Continue?'))return;state=obj;persist();ui.selectedIds.clear();ui.selectionActive=false;ui.page='dashboard';render();notify('Backup imported successfully')}catch(e){notify('Import failed: '+e.message)}};reader.readAsText(file)}
function demoProperty(overrides){return {...baseProperty(),...overrides,id:uuid(),demo:true}}
function addDemo(){if(state.properties.length&&!confirm('Add example properties alongside your current properties?'))return;const seed=[demoProperty({name:'Longview (demo) 55',suburb:'Halfway Gardens',city:'Midrand',bedrooms:2,bathrooms:1,size:87,floor:'2nd',purchasePrice:535000,initialValue:553750,deposit:100000,expectedGrowth:4.7,rateType:'fixed',fixedRate:10.2,bondDate:TODAY(),rent:5800,agentPct:10,levy:639,rates:155}),demoProperty({name:'St George (demo) 204',suburb:'Midrand',city:'Midrand',bedrooms:2,bathrooms:2,size:87,floor:'1st',purchasePrice:530000,initialValue:534450,deposit:23000,expectedGrowth:1.8,rateType:'fixed',fixedRate:9.5,rent:5280,agentPct:10,levy:594,rates:154,otherExpense:205}),demoProperty({name:'Woodlands (demo) 211',suburb:'Fourways',city:'Johannesburg',bedrooms:2,bathrooms:2,size:87,floor:'Ground',purchasePrice:578000,initialValue:597674,deposit:30000,expectedGrowth:2.5,rateType:'fixed',fixedRate:10.1,rent:5326,agentPct:10,levy:763,otherExpense:166}),demoProperty({name:'Willow Farm (demo) 32',suburb:'Northriding',city:'Johannesburg',bedrooms:1,bathrooms:1,size:57,floor:'Ground',purchasePrice:326000,initialValue:343285,deposit:4500,expectedGrowth:1.3,rateType:'fixed',fixedRate:9.7,rent:4541,agentPct:10,levy:645,rates:226}),demoProperty({name:'Santini 12 (demo from screenshots)',suburb:'Plettenberg Bay',city:'Plettenberg Bay',type:'Apartment / sectional title',bedrooms:2,bathrooms:1,size:76,floor:'2nd',purchasePrice:1880000,initialValue:2000000,deposit:0,expectedGrowth:6,rateType:'fixed',fixedRate:9.5,rent:12000,agentPct:10,levy:1200,rates:1500,otherExpense:750}),demoProperty({name:'Menlyn Maine (demo) 45',status:'wishlist',suburb:'Menlyn',city:'Pretoria',bedrooms:2,bathrooms:1,size:70,purchasePrice:675000,initialValue:675000,rent:5500,agentPct:10}),demoProperty({name:'Mountain Blue (demo) 122',status:'wishlist',suburb:'Table View',city:'Cape Town',bedrooms:2,bathrooms:1,size:70,purchasePrice:675000,initialValue:675000,rent:4900,agentPct:10})];state.properties.push(...seed);persist();render();notify('Seven marked demo properties loaded. Edit or delete freely.')}
function goto(page){ui.page=page;ui.year=0;render();window.scrollTo({top:0,behavior:'instant'})}
function confirmDelete(type,id=null,extra={}){ui.confirm={type,id,...extra,title:type==='property'?'Delete this property?':type==='entry'?'Delete this record?':'Reset all properties and settings?',message:type==='property'?'This will erase the property and all its valuations, balance updates and cash entries.':type==='entry'?'The selected historical record will be removed.':'All properties, owners, assumptions and tracking records stored in this browser will be erased.'};ui.modal='confirm';renderModal()}
function confirmDeletion(){const d=ui.confirm;if(d.type==='property'){state.properties=state.properties.filter(p=>p.id!==d.id);ui.detailId=null;ui.page='properties'}if(d.type==='entry'){const p=state.properties.find(p=>p.id===d.id);if(p&&['transactions','bondUpdates','valuations','leases'].includes(d.key))p[d.key]=p[d.key].filter(x=>x.id!==d.entry)}if(d.type==='all'){state=initState();ui.page='dashboard'}persist();closeModal();render();notify('Deleted')}
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b)return;const act=b.dataset.action,id=b.dataset.id;e.preventDefault();switch(act){
case 'nav':goto(b.dataset.page);break;case 'goto-properties':goto('properties');break;case 'goto-compare':goto('compare');break;case 'goto-portfolio':goto('portfolio');break;case 'goto-tracking':goto('tracking');break;case 'goto-settings':goto('settings');break;
case 'new-property':startWizard();break;case 'new-wish':startWizard(null,'wishlist');break;case 'edit-property':startWizard(id);break;case 'details':ui.detailId=id;goto('detail');break;case 'close-modal':closeModal();break;
case 'wizard-next':nextWizard();break;case 'wizard-back':if(saveStep()&&ui.step>0){ui.step--;renderModal()}break;
case 'new-valuation':startEvent('valuation',id);break;case 'new-bond-update':startEvent('bond',id);break;case 'new-transaction':startEvent('transaction',id);break;case 'new-lease':startLease(id);break;case 'save-lease':saveLease();break;case 'save-event':saveEvent();break;
case 'compare-snapshot':ui.compareMode='snapshots';render();break;case 'compare-timeline':ui.compareMode='timelines';render();break;case 'portfolio-snapshot':ui.portfolioMode='snapshot';render();break;case 'portfolio-timeline':ui.portfolioMode='timeline';render();break;
case 'compare-tab':ui.tab=b.dataset.tab;render();break;case 'timeline-metric':ui.timelineMetric=b.dataset.metric;render();break;case 'prev-year':ui.year=Math.max(-1,ui.year-1);render();break;case 'next-year':ui.year=Math.min(30,ui.year+1);render();break;
case 'delete-property':confirmDelete('property',id);break;case 'delete-entry':confirmDelete('entry',id,{key:b.dataset.key,entry:b.dataset.entry});break;case 'reset-data':confirmDelete('all');break;case 'confirm-delete':confirmDeletion();break;
case 'export-json':exportJSON();break;case 'export-csv':exportCSV();break;case 'import-json':$('import-file')?.click();break;case 'load-demo':addDemo();break;
case 'add-owner':ui.modal='owner';renderModal();break;case 'wizard-add-owner':{if(!saveStep())return;const name=prompt('New property owner name:');if(name?.trim()){const val=name.trim();if(!state.owners.includes(val))state.owners.push(val);ui.formDraft.owner=val;persist();renderModal();notify('Owner added')}break}
case 'save-owner':{const f=$('owner-form');if(!f?.reportValidity())return;const name=new FormData(f).get('ownerName')?.trim();if(name&&!state.owners.includes(name)){state.owners.push(name);persist()}closeModal();render();notify('Owner added');break}
}});
document.addEventListener('change',e=>{if(e.target.id==='compare-status'){ui.compareStatus=e.target.value;ui.selectionActive=false;ui.selectedIds.clear();render()}if(e.target.classList.contains('compare-check')){const eligible=state.properties.filter(p=>ui.compareStatus==='all'||p.status===ui.compareStatus);if(!ui.selectionActive){ui.selectedIds=new Set(eligible.map(p=>p.id));ui.selectionActive=true}if(e.target.checked)ui.selectedIds.add(e.target.dataset.id);else ui.selectedIds.delete(e.target.dataset.id);render()}if(e.target.id==='compare-all'){const eligible=state.properties.filter(p=>ui.compareStatus==='all'||p.status===ui.compareStatus);ui.selectionActive=true;ui.selectedIds=new Set(e.target.checked?eligible.map(p=>p.id):[]);render()}if(e.target.id==='import-file')importJSON(e.target)});
document.addEventListener('input',e=>{if(e.target.id==='property-search'){const val=e.target.value,pos=e.target.selectionStart;ui.search=val;render();const field=$('property-search');field?.focus();field?.setSelectionRange(pos,pos)}});
document.addEventListener('submit',e=>{e.preventDefault();if(e.target.id==='settings-form'){const data=Object.fromEntries(new FormData(e.target));for(const k of Object.keys(state.settings))if(k in data)state.settings[k]=n(data[k]);state.settings.projectionYears=Math.min(30,Math.max(1,Math.round(state.settings.projectionYears)));persist();render();notify('Market assumptions updated')}if(e.target.id==='wizard-form')nextWizard();if(e.target.id==='event-form')saveEvent();if(e.target.id==='lease-form')saveLease();if(e.target.id==='owner-form')$('modal-root').querySelector('[data-action="save-owner"]').click()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&ui.modal)closeModal()});
// Helpful during development and tests; no user data is exported to external services.
// Self-contained deployment; no external service worker.
render();
