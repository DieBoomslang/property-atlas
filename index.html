<script>
/* Property Atlas | zero-dependency South African property modelling application */
'use strict';
const STORE_KEY='property-atlas-store-v1';
const TODAY=()=>new Date().toISOString().slice(0,10);
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const n=v=>Number.isFinite(Number(v))?Number(v):0;
const nonneg=v=>Math.max(0,n(v));
const numFmt=new Intl.NumberFormat('en-ZA',{maximumFractionDigits:0});
const money=v=>'R '+(v<0?'-':'')+numFmt.format(Math.abs(Math.round(n(v))));
const shortMoney=v=>Math.abs(v)>=1e6?'R '+(v/1e6).toFixed(2)+'m':Math.abs(v)>=1e3?'R '+(v/1e3).toFixed(0)+'k':money(v);
const pct=v=>(Number.isFinite(v)?v.toFixed(1)+'%':'—');
const signedClass=v=>n(v)<-0.01?'negative':n(v)>0.01?'positive':'neutral';
const uuid=()=>{if(globalThis.crypto?.randomUUID)return crypto.randomUUID();return 'p-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2)};
const initState=()=>({version:1,owners:['My portfolio'],properties:[],settings:{prime:10.5,inflation:4.3,defaultGrowth:6,defaultEscalation:7,projectionYears:15},updatedAt:TODAY()});
let state;try{state=JSON.parse(localStorage.getItem(STORE_KEY)||'null')||initState()}catch{state=initState()}
if(!Array.isArray(state.properties)||!state.settings)state=initState();
let ui={page:'dashboard',year:0,tab:'value',timelineMetric:'cashflow',compareMode:'snapshots',portfolioMode:'snapshot',selectedIds:new Set(),compareStatus:'all',search:'',selectionActive:false,detailId:null,trackType:'valuations',modal:null,step:0,formDraft:null,editId:null};
let toastTimer;
function persist(){state.updatedAt=TODAY();try{localStorage.setItem(STORE_KEY,JSON.stringify(state))}catch(e){notify('Local storage is full or disabled. Export a backup.')} }
function notify(message){const t=$('toast');t.textContent=message;t.className='toast visible';clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.className='toast',3200)}
function dateShift(date,months){const d=new Date((date||TODAY())+'T12:00:00');if(!Number.isFinite(d.getTime()))return TODAY();const day=d.getDate();d.setDate(1);d.setMonth(d.getMonth()+months);d.setDate(Math.min(day,new Date(d.getFullYear(),d.getMonth()+1,0).getDate()));return d.toISOString().slice(0,10)}
const monthDiff=(date1,date2)=>{const a=new Date((date1||TODAY())+'T12:00:00'),b=new Date((date2||TODAY())+'T12:00:00');if(!Number.isFinite(a.getTime())||!Number.isFinite(b.getTime()))return 0;return (b.getFullYear()-a.getFullYear())*12+(b.getMonth()-a.getMonth());};
const yearDiff=(a,b)=>monthDiff(a,b)/12;
const futureDate=offset=>dateShift(TODAY(),offset*12);
function loanPayment(balance,annualRate,months){if(balance<=0||months<=0)return 0;const r=annualRate/1200;return r===0?balance/months:(balance*r)/(1-Math.pow(1+r,-months))}
function apr(p){return p.rateType==='fixed'?nonneg(p.fixedRate):nonneg(n(state.settings.prime)+n(p.primeDeviation))}
function originalLoan(p){return p.bonded===false?0:Math.max(0,n(p.purchasePrice)-n(p.deposit)+n(p.initiationFees))}
function mortgageAt(p,target){if(p.bonded===false||!n(p.purchasePrice))return {balance:0,payment:0,remainingMonths:0,rate:0};const rate=apr(p),start=p.bondDate||p.purchaseDate||TODAY(),initial=originalLoan(p),term=Math.max(1,Math.round(n(p.bondYears||20)*12));let balance=initial;let months=monthDiff(start,target);const updates=(p.bondUpdates||[]).filter(x=>x.date<=target).sort((a,b)=>a.date.localeCompare(b.date));let anchor=start;for(const x of updates){if(x.date<start)continue;const step=Math.max(0,Math.min(term,monthDiff(anchor,x.date)));const fixed=n(p.actualRepayment)>0?n(p.actualRepayment):loanPayment(balance,rate,Math.max(1,term-monthDiff(start,anchor)));for(let i=0;i<step;i++)balance=Math.max(0,balance*(1+rate/1200)-fixed);balance=Math.max(0,n(x.balance));anchor=x.date}
months=Math.max(0,monthDiff(anchor,target));const remaining=Math.max(0,term-monthDiff(start,anchor));const scheduled=n(p.actualRepayment)>0?n(p.actualRepayment):loanPayment(balance,rate,Math.max(1,remaining));for(let i=0;i<Math.min(months,600);i++)balance=Math.max(0,balance*(1+rate/1200)-scheduled);const left=Math.max(0,term-monthDiff(start,target));const monthly=n(p.actualRepayment)>0?n(p.actualRepayment):loanPayment(balance,rate,Math.max(1,left));return {balance,payment:balance<1?0:monthly,remainingMonths:left,rate}}
function valueAt(p,target){const baseDate=p.purchaseDate||TODAY(),valuations=(p.valuations||[]).filter(x=>x.date<=target).sort((a,b)=>a.date.localeCompare(b.date));let anchor=baseDate,base=n(p.initialValue||p.purchasePrice);if(valuations.length){anchor=valuations.at(-1).date;base=n(valuations.at(-1).value)}const growth=n(p.expectedGrowth??state.settings.defaultGrowth);return Math.max(0,base*Math.pow(1+growth/100,yearDiff(anchor,target)))}
function metric(p,offset=0){const target=futureDate(offset);const base=TODAY();const years=yearDiff(base,target);const infl=Math.pow(1+n(state.settings.inflation)/100,years);const rent=n(p.rent)*Math.pow(1+n(p.escalation??state.settings.defaultEscalation)/100,years);const letting=rent*n(p.agentPct)/100;const mortgage=mortgageAt(p,target);const levy=n(p.levy)*infl,rates=n(p.rates)*infl,maintenance=n(p.maintenance)*infl,other=n(p.otherExpense)*infl,admin=mortgage.balance>0?n(p.adminFee):0;const outgoings=mortgage.payment+levy+rates+maintenance+other+admin;const income=rent-letting,expenses=outgoings+letting,cf=income-outgoings;const value=valueAt(p,target),bond=mortgage.balance,equity=value-bond,capitalGrowth=value-n(p.purchasePrice);const gross= mortgage.payment>0?rent/mortgage.payment*100:(rent>0?Infinity:0);const net=outgoings>0?income/outgoings*100:(income>0?Infinity:0);const tracked=(p.transactions||[]).filter(x=>x.date<=target).reduce((s,x)=>s+(x.kind==='income'?1:-1)*n(x.amount),0);let invested=nonneg(p.deposit)+nonneg(p.transferCost)+nonneg(p.transferDuty)+nonneg(p.renovations)+nonneg(p.otherInitial)+(p.bonded===false?n(p.purchasePrice):0)+Math.max(0,-tracked);let returns=equity+Math.max(0,tracked);if(offset>0){for(let i=0;i<offset;i++){const sim=metricCF(p,i);const tot=sim*12;if(tot<0)invested-=tot;else returns+=tot}}const profit=returns-invested,roi=invested>0?(profit/invested*100):0;return {target,rent,letting,levy,rates,maintenance,other,admin,repayment:mortgage.payment,outgoings,expenses,income,cf,value,bond,equity,gross,net,invested,returns,profit,roi,capitalGrowth,rate:mortgage.rate,remainingMonths:mortgage.remainingMonths,size:n(p.size),priceSqm:n(p.size)>0?value/n(p.size):0,rentValue:value>0?(rent*12/value)*100:0,growth:n(p.expectedGrowth),escalation:n(p.escalation),lettingPct:n(p.agentPct)} }
function metricCF(p,offset){const target=futureDate(offset),years=yearDiff(TODAY(),target),infl=Math.pow(1+n(state.settings.inflation)/100,years),rent=n(p.rent)*Math.pow(1+n(p.escalation??state.settings.defaultEscalation)/100,years),loan=mortgageAt(p,target);return rent*(1-n(p.agentPct)/100)-loan.payment-n(p.adminFee)*(loan.balance>0?1:0)-(n(p.levy)+n(p.rates)+n(p.maintenance)+n(p.otherExpense))*infl;}
function portfolio(props,year=0){const vals=props.map(p=>metric(p,year));const total=k=>vals.reduce((s,v)=>s+(Number.isFinite(v[k])?v[k]:0),0);const income=total('income'),out=total('outgoings'),rep=total('repayment'),rent=total('rent');return {count:props.length,value:total('value'),bond:total('bond'),equity:total('equity'),rent,income,outgoings:out,expenses:total('expenses'),cf:total('cf'),invested:total('invested'),returns:total('returns'),profit:total('profit'),roi:total('invested')?total('profit')/total('invested')*100:0,gross:rep?rent/rep*100:0,net:out?income/out*100:0,gearing:total('value')?total('bond')/total('value')*100:0,levy:total('levy'),rates:total('rates'),letting:total('letting'),maintenance:total('maintenance'),other:total('other'),admin:total('admin'),repayment:rep,capitalGrowth:total('capitalGrowth')}}

function chartBars(labels,series,{height=265,percent=false}={}){if(!labels.length)return `<div class="empty">Add a property to display a chart.</div>`;const W=960,H=height,L=72,R=25,T=24,B=58,plotW=W-L-R,plotH=H-T-B;const values=series.flatMap(s=>s.values.map(x=>Number.isFinite(x)?x:0));const top=Math.max(1,...values,0),bottom=Math.min(0,...values);const pad=(top-bottom)*.12||1;const max=top+pad,min=bottom>=0?0:Math.min(0,bottom-pad);const y=v=>T+(max-v)/(max-min)*plotH;let svg=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Comparison chart" preserveAspectRatio="xMidYMid meet">`;for(let t=0;t<=5;t++){const val=min+(max-min)*t/5,yy=y(val);svg+=`<line class="chart-gridline" x1="${L}" x2="${W-R}" y1="${yy}" y2="${yy}"/><text class="chart-axis" x="${L-9}" y="${yy+4}" text-anchor="end">${percent?val.toFixed(0)+'%':shortMoney(val)}</text>`}const base=y(0),group=plotW/labels.length;const bw=Math.min(31,(group*.77)/Math.max(1,series.length));labels.forEach((label,i)=>{const mid=L+group*(i+.5);series.forEach((s,j)=>{const val=Number.isFinite(s.values[i])?s.values[i]:0;const xx=mid-(series.length*bw)/2+j*bw+2,yy=y(val),rh=Math.max(1,Math.abs(base-yy));svg+=`<rect x="${xx}" y="${Math.min(yy,base)}" width="${Math.max(2,bw-4)}" height="${rh}" rx="2" fill="${s.color}" opacity=".94"><title>${esc(label)} — ${esc(s.name)}: ${percent?ratio(val):money(val)}</title></rect>`});const cut=label.length>20?label.slice(0,19)+'…':label;svg+=`<text class="chart-label" text-anchor="middle" x="${mid}" y="${H-26}">${esc(cut)}</text>`});svg+=`</svg>`;return `<div class="chart-frame">${svg}</div><div class="legend">${series.map(s=>`<span><b style="background:${s.color}"></b>${esc(s.name)}</span>`).join('')}</div>`}
function chartLine(labels,series,{height=270,percent=false}={}){if(!series.length||!labels.length)return `<div class="empty">No data to chart.</div>`;const W=960,H=height,L=76,R=23,T=22,B=48,plotW=W-L-R,plotH=H-T-B;const values=series.flatMap(s=>s.values.filter(Number.isFinite));const max=Math.max(1,...values,0),min=Math.min(0,...values),range=max-min||1;const pad=range*.11,lo=min-pad,hi=max+pad;const y=v=>T+(hi-v)/(hi-lo)*plotH,xx=i=>L+i/(labels.length-1||1)*plotW;let svg=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Financial projection line chart">`;for(let k=0;k<=5;k++){const v=lo+(hi-lo)*k/5,cy=y(v);svg+=`<line class="chart-gridline" x1="${L}" x2="${W-R}" y1="${cy}" y2="${cy}"/><text x="${L-9}" y="${cy+3}" class="chart-axis" text-anchor="end">${percent?v.toFixed(0)+'%':shortMoney(v)}</text>`}labels.forEach((label,i)=>{if(i%Math.max(1,Math.ceil(labels.length/8))===0||i===labels.length-1)svg+=`<text x="${xx(i)}" y="${H-16}" class="chart-label" text-anchor="middle">${esc(label)}</text>`});series.forEach(s=>{const coords=s.values.map((v,i)=>[xx(i),y(Number.isFinite(v)?v:0)]);svg+=`<polyline fill="none" stroke="${s.color}" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round" points="${coords.map(x=>x.join(',')).join(' ')}"/>`;coords.forEach(([cx,cy],i)=>{svg+=`<circle cx="${cx}" cy="${cy}" r="3" fill="${s.color}"><title>${esc(s.name)}, ${esc(labels[i])}: ${percent?ratio(s.values[i]):money(s.values[i])}</title></circle>`})});return `<div class="chart-frame">${svg}</div><div class="legend">${series.map(s=>`<span><b style="background:${s.color}"></b>${esc(s.name)}</span>`).join('')}</div>`}

function airbnb(d){const r=calculate(d);return `<div class="ac-columns">${fields('Seasonal short-stay income',[input('Reference nightly rate','airNight',d.airNight),input('Number of high-season months','airHighMonths',d.airHighMonths),input('High-season rate per night','airHighRate',d.airHighRate),input('High-season occupancy (%)','airHighOcc',d.airHighOcc),input('Other-months rate per night','airLowRate',d.airLowRate),input('Other-months occupancy (%)','airLowOcc',d.airLowOcc)],'Seasonal income uses all twelve months and actual occupied nights.')}${fields('Fees, cleaning and furnishings',[input('Platform fee (%)','airPlatformPct',d.airPlatformPct),input('Management fee (%)','airManagerPct',d.airManagerPct),input('Cleaning charged per booking (R)','airCleanCharge',d.airCleanCharge),input('Cleaning paid per booking (R)','airCleanCost',d.airCleanCost),input('Linen / laundry per booking (R)','airLaundry',d.airLaundry),input('Average nights per booking','airStay',d.airStay),input('Other short-stay monthly costs (R)','airMonthly',d.airMonthly),input('Furnishing budget (R)','furnishing',d.furnishing),input('Startup and photography costs (R)','airSetup',d.airSetup)],'Includes existing levy, taxes, insurance and other operating costs.')}</div><div class="ac-columns">${box('Airbnb results',`<div class="ac-lines">${line('Occupied nights / year',r.booked.toFixed(0))}${line('Average gross booking revenue / month',m(r.airRevenue))}${line('Average guest turnovers / month',r.bookingCount.toFixed(1))}${line('Net cleaning margin / month',m(r.cleanMargin))}${line('Net operating income / month',m(r.airNoi))}${line('Net monthly cash flow',m(r.airCF))}${line('Net annual cash flow',m(r.airCF*12))}${line('Break-even occupancy at reference nightly rate',pc(r.airBreakeven))}</div>`)}${box('Airbnb vs long-term rental',`<div class="ac-lines">${line('Monthly long-term rental CF',m(r.cf))}${line('Monthly short-term rental CF',m(r.airCF))}${line('Airbnb advantage / shortfall',m(r.airCF-r.cf))}${line('Extra furnishing and startup',m(nn(d.furnishing)+nn(d.airSetup)))}</div><p class="ac-hint">The break-even occupancy uses the reference nightly rate, not the seasonal mix. Verify local rules, taxes and occupancy evidence.</p>`)}</div>`;}
function livein(d){const r=calculate(d);return `<div class="ac-columns">${fields('Flatlet and household',[input('Flatlet rent (R/month)','flatletRent',d.flatletRent),input('Flatlet vacancy (%)','flatletVacancy',d.flatletVacancy),input('Flatlet management fee (%)','flatletManager',d.flatletManager),input('Flatlet-specific operating costs (R/month)','flatletExtra',d.flatletExtra),input('Cost of renting comparable house (R/month)','comparableHousingRent',d.comparableHousingRent)],'Your owner-occupied house, offset by the net rent from the cottage.')}${box('Housing affordability results',`<div class="ac-lines">${line('Bond repayments',m(r.payment))}${line('Household expenses',m(r.operating))}${line('Flatlet net rent',m(r.flatNet))}${line('Flatlet-specific expenses',m(d.flatletExtra))}${line('Effective monthly housing cost',m(r.housing))}${line('Comparable monthly rent',m(d.comparableHousingRent))}${line('Monthly savings versus renting',m(r.homeSaving))}${line('Annual savings',m(r.homeSaving*12))}</div><p class="ac-hint">Owner-occupier housing costs are not equivalent to investment profit. Confirm that the flatlet can legally be rented.</p>`)}</div>`;}
function valuation(d){const r=calculate(d),lim=maxOffer(d),cmp=compVal(d);return `<div class="ac-columns">${fields('Market valuation',[input('Municipal valuation (R)','municipalValue',d.municipalValue),input('Fair market value / agent valuation (R)','fairValue',d.fairValue),input('Asking price (R)','askingPrice',d.askingPrice),input('Working offer price (R)','price',d.price),input('Floor area (m²)','size',d.size)],'The municipal roll is useful context but not proof of the real sale price.')}${box('Offer and value calculations',`<div class="ac-lines">${line('Sale-comparable benchmark',cmp?m(cmp):'Not supplied')}${line('Fair-market benchmark',r.fair?m(r.fair):'Not supplied')}${line('Discount to fair value',pc(r.discount))}${line('Price per m²',nn(d.size)?m(r.price/nn(d.size)):'—')}${line('Municipal valuation',m(d.municipalValue))}${line('Maximum financially viable offer',lim.viable?m(lim.value):'Not viable')}${line('Cash-flow / profit target',d.strategy==='flip'?m(d.targetFlipProfit)+' profit':d.strategy==='livein'?m(d.comparableHousingRent)+' housing cost':m(d.targetCashflow)+'/month')}</div><button class="btn btn-primary" data-ac-act="use-max-offer" ${!lim.viable?'disabled':''}>Set working offer to viable maximum</button><p class="ac-hint">Maximum viable means the financial model threshold, not market value. Do not use it to justify paying above comparable market sales.</p>`)}</div>${box('Comparable sales',`${table(['Street and address','Sold on','Selling price','Area','Adjustment'],d.comparables,(q,i)=>`<tr><td>${xss(q.address)}</td><td>${xss(q.date)}</td><td>${m(q.price)}</td><td>${val(q.size)||'—'}</td><td>${pc(val(q.adjustment))}</td><td><button class="ac-icon" data-ac-act="remove" data-list="comparables" data-index="${i}">×</button></td></tr>`)}<form id="ac-comps" class="ac-inline"><input name="address" placeholder="Property / source" required/><input name="date" type="date" value="${TODAY()}" required/><input name="price" placeholder="Sold for R" type="number" function inspection(d){const count=Object.values(d.inspection).filter(t=>t.status&&t.status!=='Not checked').length;return `<div class="ac-columns">${box('Viewing and inspection checklist',`<p class="ac-hint">${count} of ${INSPECT.length} checks marked. Record observed conditions, not assumptions.</p>${INSPECT.map((i,k)=>{let o=d.inspection[i]||{};return `<div class="ac-check"><label>${k+1}. ${xss(i)}</label><select data-inspect="${xss(i)}" data-aspect="status">${['Not checked','Good','Needs attention','Urgent','Not applicable'].map(s=>`<option ${o.status===s?'selected':''}>${s}</option>`).join('')}</select><input data-inspect="${xss(i)}" data-aspect="comment" value="${xss(o.comment||'')}" placeholder="Notes, issue, estimated repairs"/></div>`}).join('')}`)}${fields('Inspection and investment scoring',[input('Viewing date','inspectionDate',d.inspectionDate,'date'),input('Location / safety score 0–10','locationScore',d.locationScore),input('Demand score 0–10','demandScore',d.demandScore),input('Property condition score 0–10','conditionScore',d.conditionScore),input('Resale and liquidity score 0–10','liquidityScore',d.liquidityScore),multiline('Outstanding inspection issues / due diligence','inspectionNotes',d.inspectionNotes)])}</div>`;}
function scenarios(d){const all=stressed(d);return `${box('Downside / upside stress testing',`<p class="ac-hint">Try changes in borrowing rates, income, vacancy, resale value and the length and cost of your renovation.</p><div class="ac-overflow"><table class="ac-table"><thead><tr><th>Scenario</th><th>Bond / month</th><th>Rental CF / month</th><th>Airbnb CF / month</th><th>Flip profit</th><th>Housing cost</th><th>Cash needed</th><th></th></tr></thead><tbody>${all.map((item,i)=>`<tr><th>${xss(item.label)}</th><td>${m(item.r.payment)}</td><td>${m(item.r.cf)}</td><td>${m(item.r.airCF)}</td><td>${m(item.r.flipProfit)}</td><td>${m(item.r.housing)}</td><td>${m(item.r.initialCash)}</td><td>${i>2?`<button class="ac-icon" data-ac-act="remove" data-list="scenarios" data-index="${i-3}">×</button>`:''}</td></tr>`).join('')}</tbody></table></div>`)}${box('Custom scenario builder',`<form class="ac-inline" id="ac-scenarios"><input name="name" placeholder="Scenario name" required/><label>Interest ± points<input name="rateDelta" type="number" step="any" value="0"/></label><label>Price ±%<input name="priceDelta" type="number" step="any" value="0"/></label><label>Rental ±%<input name="rentDelta" type="number" step="any" value="0"/></label><label>Vacancy ± points<input name="vacancyDelta" type="number" step="any" value="0"/></label><label>Resale ±%<input name="saleDelta" type="number" step="any" value="0"/></label><label>Holding extra months<input name="holdingDelta" type="number" value="0"/></label><label>Contingency ± points<input name="contingencyDelta" type="number" step="any" value="0"/></label><button class="btn btn-primary" type="submit">+ Save scenario</button></form>`)}`;}
function forecastPage(d){const f=forecast(d,d.exitYear);return `<div class="ac-columns">${fields('Forecast and sale assumptions',[input('Number of years until sale','exitYear',d.exitYear),input('Capital appreciation (% p.a.)','growth',d.growth),input('Rent escalation (% p.a.)','exitRentGrowth',d.exitRentGrowth),input('Cost inflation (% p.a.)','exitInflation',d.exitInflation),input('Exit tax provision on modelled gain (%)','exitTaxPct',d.exitTaxPct)],'The tax entry is a manual effective assumption, not an automated SARS CGT computation.')}${box('Exit summary',`<div class="ac-lines">${line('Projected value',m(f.last.value))}${line('Remaining mortgage',m(f.last.bond))}${line('Estimated equity',m(f.last.equity))}${line('Cumulative operating cash flow',m(f.last.cf))}${line('Net sale proceeds',m(f.last.proceeds))}${line('Overall profit after initial cash',m(f.last.profit))}${line('Annualised IRR',pc(f.irr))}${line('Tax reserve assumed',m(f.last.tax))}</div><p class="ac-hint">CGT exemptions and deductions depend on individual circumstances. Request a tax professional's estimate before selling.</p>`)}</div>${box('Projected property value and bond balance',chartLine(f.data.map(x=>'Year '+x.year),[{name:'Value',color:'#29806b',values:f.data.map(x=>x.value)},{name:'Bond',color:'#c28e64',values:f.data.map(x=>x.bond)},{name:'Equity',color:'#517ab3',values:f.data.map(x=>x.equity)}],{height:250}))}${box('Annual model',table(['Year','Value','Bond','Equity','Accumulated cash flow','Net sale proceeds'],f.data,(q)=>`<tr><td>${q.year}</td><td>${m(q.value)}</td><td>${m(q.bond)}</td><td>${m(q.equity)}</td><td>${m(q.cf)}</td><td>${m(q.proceeds)}</td><td></td></tr>`))}`;}
function docs(d){return `<div class="ac-columns">${box('Viewing photos',`<p class="ac-hint">Photos are compressed and stored in your browser backup, not in the public GitHub repository. Browser storage has limited capacity.</p><label class="ac-upload">+ Add inspection photos<input id="ac-photo" type="file" accept="image/*" multiple hidden/></label><div class="ac-images">${d.photos.map((q,i)=>`<figure><img src="${q.content}" alt="Inspection photo"/><figcaption>${xss(q.name)} <button class="ac-icon" data-ac-act="remove" data-list="photos" data-index="${i}">×</button></figcaption></figure>`).join('')}</div>`)}${box('Documents and listing links',`${table(['Reference','Link'],d.links,(q,i)=>`<tr><td>${xss(q.title)}</td><td><a href="${/^https?:\/\//.test(q.url)?xss(q.url):'#'}" target="_blank" rel="noopener noreferrer">Open ↗</a></td><td><button class="ac-icon" data-ac-act="remove" data-list="links" data-index="${i}">×</button></td></tr>`)}<form id="ac-links" class="ac-inline"><input name="title" placeholder="e.g. Property24 listing" required/><input name="url" type="url" placeholder="https://..." required/><button class="btn btn-primary" type="submit">+ Save reference</button></form>`)}</div>${box('Due diligence and follow-ups',`${table(['Due date','Task','Completed'],d.tasks,(q,i)=>`<tr><td>${xss(q.date)}</td><td>${xss(q.task)}</td><td><input type="checkbox" data-task="${i}" ${q.done?'checked':''}/></td><td><button class="ac-icon" data-ac-act="remove" data-list="tasks" data-index="${i}">×</button></td></tr>`)}<form id="ac-tasks" class="ac-inline"><input name="date" type="date"/><input name="task" placeholder="e.g. Ask for building plans" required/><button class="btn btn-primary" type="submit">+ Save task</button></form>`)}${box('Acquisition handover',`<p class="ac-hint">After purchase, transfer the deal into your existing portfolio. This records its financial assumptions as a new owned property and preserves the acquisition research.</p>${d.portfolioId?'<p class="ac-cal function segment(d){switch(ui.acq.tab){case 'finance':return finance(d);case 'rental':return rental(d);case 'flip':return flip(d);case 'airbnb':return airbnb(d);case 'livein':return livein(d);case 'valuation':return valuation(d);case 'inspection':return inspection(d);case 'scenarios':return scenarios(d);case 'forecast':return forecastPage(d);case 'documents':return docs(d);default:return overview(d)}}
function listPage(){setup();let deals=state.acquisitions.filter(d=>(ui.acq.filter==='all'||d.status===ui.acq.filter)&&`${d.name} ${d.address} ${d.suburb}`.toLowerCase().includes(ui.acq.query.toLowerCase())).sort((a,b)=>ui.acq.sort==='score'?score(b).score-score(a).score:ui.acq.sort==='price'?val(a.price)-val(b.price):ui.acq.sort==='date'?String(b.updatedAt).localeCompare(String(a.updatedAt)):aName(a).localeCompare(aName(b)));const active=state.acquisitions.filter(d=>!['Purchased','Rejected'].includes(d.status)),good=active.filter(d=>score(d).score>=val(state.acquisitionPreferences.minimumScore)),offers=active.filter(d=>['Offer submitted','Under contract'].includes(d.status));let s=`<header class="ac-heading"><div><div class="eyebrow">Property investment intelligence</div><h1>Acquisitions</h1><p>Analyse, inspect, compare and negotiate property purchases before adding them to your portfolio.</p></div><div class="ac-actions"><button class="btn" data-ac-act="compare">Compare selected</button><button class="btn btn-primary" data-ac-act="new">+ New acquisition</button></div></header><div class="ac-metrics">${[['Active deals',active.length,'Properties under review'],['High-potential deals',good.length,'At or above your scoring threshold'],['Offers in progress',offers.length,'Submitted / under contract'],['Allowed monthly shortfall',m(state.acquisitionPreferences.maxShortfall),'Your default financial threshold']].map(([a,b,c])=>`<div class="ac-stat"><span>${xss(a)}</span><strong>${xss(b)}</strong><small>${xss(c)}</small></div>`).join('')}</div><div class="ac-tools"><input id="ac-search" value="${xss(ui.acq.query)}" placeholder="Search addresses or suburbs"/><select id="ac-filter"><option value="all">All stages</option>${AS.map(z=>`<option ${ui.acq.filter===z?'selected':''}>${z}</option>`).join('')}</select><select id="ac-sort"><option value="score" ${ui.acq.sort==='score'?'selected':''}>Highest score</option><option value="date" ${ui.acq.sort==='date'?'selected':''}>Recently updated</option><option value="price" ${ui.acq.sort==='price'?'selected':''}>Lowest price</option><option value="name" ${ui.acq.sort==='name'?'selected':''}>Property name</option></select><button class="btn" data-ac-act="criteria">Criteria</button></div>`;
 if(!state.acquisitions.length)s+=`<div class="ac-empty"><div style="font-size:42px">⌂</div><h2>Evaluate your next property</h2><p>Add the address and price from a listing or viewing. Then model repayments, rental yield, renovation costs, Airbnb returns and a maximum viable offer.</p><button class="btn btn-primary" data-ac-act="new">+ Add your first acquisition</button></div>`;
 else if(!deals.length)s+=`<div class="ac-empty"><h2>No matching properties</h2><p>Change your search or filter.</p></div>`;
 else s+=`<div class="ac-deals">${deals.map(d=>{const r=calculate(d),s=score(d),key=d.strategy==='flip'?r.flipProfit:d.strategy==='airbnb'?r.airCF:d.strategy==='livein'?r.housing:r.cf;return `<article class="ac-deal"><div class="ac-deal-top"><span class="ac-stage">${xss(d.status)}</span><b class="ac-score ${s.score>=val(state.acquisitionPreferences.minimumScore)?'good':''}">${s.score.toFixed(1)}/10</b></div><h2>${xss(aName(d))}</h2><p>${xss(location(d)||'Address not entered')}</p><div class="ac-strategy">${xss(MODES[d.strategy]||d.strategy)}</div><div class="ac-deal-grid"><div><small>Modelled price</small><strong>${m(d.price)}</strong></div><div><small>${d.strategy==='flip'?'Flip profit':d.strategy==='livein'?'Housing cost':'Net monthly CF'}</small><strong>${m(key)}</strong></div></div><div class="ac-deal-bottom"><button class="btn btn-primary btn-small" data-ac-act="open" data-id="${d.id}">View investment →</button><label><input data-compare="${d.id}" type="checkbox" ${ui.acq.compare.includes(d.id)?'checked':''}/> Compare</label></div></article>`}).join('')}</div>`;
 return s+`<p class="ac-hint">Your saved acquisitions stay in this browser. Use Settings → Download backup to retain a copy, including compressed inspection photos.</p>`;}
function detailPage(){const d=ui.acq.draft||getDeal(ui.acq.id);if(!d)return listPage();return `<header class="ac-heading"><div><div class="eyebrow">Acquisitions / ${xss(d.status)}</div><h1>${xss(aName(d))}</h1><p>${xss(location(d))}</p></div><div class="ac-actions"><button class="btn" data-ac-act="back">← All deals</button><button class="btn" data-ac-act="report">Report / PDF</button><button class="btn" data-ac-act="duplicate">Duplicate</button><button class="btn btn-primary" data-ac-act="save">Save</button></div></header><div id="ac-overview">${overviewStats(d)}</div><div class="ac-tabs">${Object.entries(TABS).map(([k,v])=>`<button class="ac-tab ${ui.acq.tab===k?'active':''}" data-ac-act="tab" data-tab="${k}">${xss(v)}</button>`).join('')}</div><div class="ac-content">${segment(d)}</div><div class="ac-bottom"><button class="btn" data-ac-act="back">← Back to pipeline</button><button class="btn btn-primary" data-ac-act="save">Save analysis</button></div>`;}
function comparePage(){const selected=ui.acq.compare.map(id=>getDeal(id)).filter(Boolean),lines=[['Status',d=>d.status],['Strategy',d=>MODES[d.strategy]],['Score',d=>score(d).score.toFixed(1)+'/10'],['Purchase price',d=>m(d.price)],['Fair value',d=>m(calculate(d).fair)],['Upfront cash',d=>m(calculate(d).initialCash)],['Monthly mortgage',d=>m(calculate(d).payment)],['Rental cash flow',d=>m(calculate(d).cf)],['Gross rental yield',d=>pc(calculate(d).grossYield)],['NOI yield',d=>pc(calculate(d).netYield)],['Cash-on-cash',d=>pc(calculate(d).coc)],['Break-even rent',d=>m(calculate(d).breakEven)],['Airbnb CF',d=>m(calculate(d).airCF)],['Housing cost',d=>m(calculate(d).housing)],['Flip profit',d=>m(calculate(d).flipProfit)],['Maximum viable offer',d=>m(maxOffer(d).value)]];return `<header class="ac-heading"><div><h1>Acquisition comparison</h1><p>Compare up to four selected deals.</p></div><button class="btn" data-ac-act="back">← Pipeline</button></header>${selected.length<2?`<div class="ac-empty"><h2>Select at least two properties</h2><p>Tick Compare on the acquisition cards first.</p></div>`:box('Side-by-side financial performance',`<div class="ac-overflow"><table class="ac-table ac-compare"><thead><tr><th>Measure</th>${selected.map(d=>`<th>${xss(aName(d))}</th>`).join('')}</tr></thead><tbody>${lines.map(([k,f])=>`<tr><th>${xss(k)}</th>${selected.map(d=>`<td>${xss(f(d))}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`)}`;}
function criteria(){let c=state.acquisitionPreferences;return `<header class="ac-heading"><div><h1>Acquisition criteria</h1><p>Set your hard cash-flow limit and optional screening score weights.</p></div><button class="btn" data-ac-act="back">← Pipeline</button></header>${box('Custom investment criteria',`<form id="ac-criteria"><div class="ac-fields">${input('Minimum score (/10)','minimumScore',c.minimumScore)}${input('Maximum acceptable monthly shortfall (R)','maxShortfall',c.maxShortfall)}${input('Default bond interest (%)','defaultInterest',c.defaultInterest)}${Object.entries(c.weights).map(([k,v])=>input('Scoring weight: '+k,'weight_'+k,v)).join('')}</div><button class="btn btn-primary" type="submit">Save investment criteria</button></form>`)}`;}
function acRender(){setup();let view=ui.acq.id==='compare'?comparePage():ui.acq.id==='criteria'?criteria():ui.acq.id?detailPage():listPage();get('app').innerHTML=shell(view);}
let originalShell=shell;shell=(content)=>originalShell(content).replace(/(?=<button class="nav-item[^\"]*" data-action="nav" data-page="properties")/,`<button class="nav-item ${ui.page==='acquisitions'?'active':''}" data-action="nav" data-page="acquisitions"><span class="nav-ico">⌕</span>Acquisitions</button>`);
let originalRender=render;render=()=>ui.page==='acquisitions'?acRender():originalRender();
function openAcq(id){const d=getDeal(id);if(!d)return;ui.acq.id=id;ui.acq.tab='overview';ui.acq.draft=structuredClone(d);ui.page='acquisitions';render();window.scrollTo(0,0);}
function save(silent=false){const d=ui.acq.draft;if(!d)return;d.updatedAt=TODAY();let i=state.acquisitions.findIndex(x=>x.id===d.id);if(i>=0)state.acquisitions[i]=structuredClone(d);else state.acquisitions.push(structuredClone(d));persist();if(!silent)notify('Acquisition saved');}
function updateField(el){const d=ui.acq.draft;if(!d)return;const key=el.dataset.afield;d[key]=el.type==='text'||el.type==='date'||el.type==='url'||el.type==='email'||el.type==='tel'||el.tagName==='SELECT'||el.tagName==='TEXTAREA'?el.value:val(el.value);const s=get('ac-overview');if(s)s.innerHTML=overviewStats(d);}
function removeFromList(key,index){let d=ui.acq.draft;if(!d||!Array.isArray(d[key]))return;d[key].splice(index,1);save(true);render();}
function transferPortfolio(){const d=ui.acq.draft;if(!d||d.portfolioId)return;if(!confirm('Create an owned property in your portfolio using these modelled assumptions? Review actual bank and tax figures afterwards.'))return;const r=calculate(d),b=baseProperty();const property={...b,name:aName(d),street:d.address,suburb:d.suburb,city:d.city,type:d.ownership==='Sectional title'?'Apartment / sectional title':'Freehold house',bedrooms:val(d.bedrooms),bathrooms:val(d.bathrooms),size:val(d.size),status:'owned',purchasePrice:r.price,initialValue:r.fair||r.price,deposit:r.deposit,initiationFees:nn(d.financedInitiation)+nn(d.financedReno),bondYears:val(d.term),rateType:'fixed',fixedRate:val(d.interestRate),actualRepayment:nn(d.extraPayment)>0?r.payment:0,transferDuty:r.transfer,transferCost:nn(d.conveyancing)+nn(d.bondRegistration),otherInitial:nn(d.bankFees)+nn(d.inspectionFees)+nn(d.otherClosing),renovations:r.renovation+nn(d.furnishing)+nn(d.airSetup),rent:d.strategy==='livein'?nn(d.flatletRent):d.strategy==='airbnb'?r.airRevenue:nn(d.rent),agentPct:d.strategy==='airbnb'?nn(d.airPlatformPct)+nn(d.airManagerPct):d.strategy==='livein'?nn(d.flatletManager):nn(d.lettingPct),levy:nn(d.levy),rates:nn(d.rates),maintenance:nn(d.maintenance),otherExpense:nn(d.insurance)+nn(d.utilities)+nn(d.wifi)+nn(d.security)+nn(d.otherOperating)+nn(d.airMonthly),adminFee:nn(d.adminFee),escalation:nn(d.rentGrowth),notes:'Imported from acquisition analysis. Reconcile actual bond, rental type and expense details. '+(d.notes||'')};state.properties.push(property);d.portfolioId=property.id;d.status='Purchased';save(true);render();notify('Transferred to portfolio. Verify final mortgage and lease details.');}
function printReport(){const d=ui.acq.draft;if(!d)return;save(true);let r=calculate(d),f=forecast(d,d.exitYear),sc=score(d),max=maxOffer(d),a=[['Deal score',sc.score.toFixed(1)+'/10'],['Asking price',m(d.askingPrice)],['Working offer',m(r.price)],['Mortgage',m(r.loan)],['Cash upfront',m(r.initialCash)],['Bond repayment / month',m(r.payment)],['Transfer duty',m(r.transfer)],['Net rental CF / month',m(r.cf)],['Airbnb CF / month',m(r.airCF)],['Live-in housing cost / month',m(r.housing)],['Flip profit',m(r.flipProfit)],['Fair-market value',m(r.fair)],['Max viable offer',max.viable?m(max.value):'Not viable'],['Exit projected value',m(f.last.value)],['Annual IRR',pc(f.irr)]];let html=`<!doctype html><html><head><meta charset="utf-8"><title>Investment report: ${xss(aName(d))}</title><style>body{font:14px Arial,sans-serif;max-width:800px;margin:30px auto;color:#173e33}h1{font-size:28px}h2{border-bottom:1px solid #ccdcd3;padding-bottom:8px;margin-top:28px}table{width:100%;border-collapse:collapse}td,th{border-bottom:1px solid #e8ece9;padding:7px;text-align:left}th{text-align:right}footer{font-size:11px;color:#788c81;margin-top:30px}@media print{body{margin:0}}</style></head><body><h1>${xss(aName(d))}</h1><p>${xss(location(d))} · ${xss(d.status)} · ${xss(MODES[d.strategy])}</p><h2>Financial report</h2><table>${a.map(z=>`<tr><td>${z[0]}</td><th>${z[1]}</th></tr>`).join('')}</table><h2>Inspection</h2><p>${xss(d.inspectionNotes)}</p><ul>${Object.entries(d.inspection).filter(([k,v])=>v.status&&v.status!=='Not checked').map(([k,v])=>`<li>${xss(k)}: ${xss(v.status)} — ${xss(v.comment||'')}</li>`).join('')}</ul><h2>Research notes</h2><p>${xss(d.notes||'Not entered')}</p><footer>Property Atlas · ${TODAY()} · Estimates only; validate valuations, tax advice and credit terms.</footer></body></html>`;const w=window.open('','_blank');if(!w){notify('Allow pop-ups to print the report');return;}w.document.write(html);w.document.close();w.focus();setTimeout(()=>w.print(),250);}
async function addPhotos(list){let d=ui.acq.draft;for(const file of [...list].slice(0,5)){try{if(!file.type.startsWith('image/'))continue;const url=URL.createObjectURL(file),img=new Image();await new Promise((resolve,reject)=>{img.onload=resolve;img.onerror=reject;img.src=url;});const can=document.createElement('canvas'),scale=Math.min(1,900/Math.max(img.width,img.height));can.width=Math.round(img.width*scale);can.height=Math.round(img.height*scale);can.getContext('2d').drawImage(img,0,0,can.width,can.height);d.photos.push({name:file.name.slice(0,150),content:can.toDataURL('image/jpeg',.62)});URL.revokeObjectURL(url);}catch(e){notify('Could not read image')}}save(true);render();notify('Photos stored locally. Back up your data.');}
function intakeForm(form,what,mapper){const o=Object.fromEntries(new FormData(form));ui.acq.draft[what].push(mapper(o));save(true);render();notify('Entry added');}
document.addEventListener('click',e=>{if(ui.page!=='acquisitions')return;const b=e.target.closest('[data-ac-act]');if(!b)return;e.preventDefault();const action=b.dataset.acAct,d=ui.acq.draft;switch(action){case 'new':{let a=seed();state.acquisitions.push(a);persist();openAcq(a.id);break;}case 'open':openAcq(b.dataset.id);break;case 'back':if(d)save(true);ui.acq.draft=null;ui.acq.id=null;render();window.scrollTo(0,0);break;case 'tab':save(true);ui.acq.tab=b.dataset.tab;render();break;case 'save':save();render();break;case 'compare':ui.acq.draft=null;ui.acq.id='compare';render();break;case 'criteria':ui.acq.draft=null;ui.acq.id='criteria';render();break;case 'duplicate':{let q=structuredClone(d);q.id=uniq();q.name=aName(d)+' (copy)';q.status='Identified';q.offers=[];q.portfolioId=null;state.acquisitions.push(q);persist();openAcq(q.id);break;}case 'remove':removeFromList(b.dataset.list,+b.dataset.index);break;case 'use-max-offer':{const v=maxOffer(d);if(v.viable){d.price=Math.round(v.value/1000)*1000;save(true);render();notify('Working offer updated')}break;}case 'to-portfolio':transferPortfolio();break;case 'report':printReport();break;case 'delete':if(confirm('Delete this acquisition and its inspection information?')){state.acquisitions=state.acquisitions.filter(x=>x.id!==d.id);persist();ui.acq.id=null;ui.acq.draft=null;render();notify('Acquisition deleted')}break;}});
document.addEventListener('input',e=>{if(ui.page!=='acquisitions')return;if(e.target.id==='ac-search'){ui.acq.query=e.target.value;let pos=e.target.selectionStart;render();get('ac-search')?.focus();get('ac-search')?.setSelectionRange(pos,pos);}if(e.target.matches('[data-afield]')&&!get('ac-criteria')?.contains(e.target))updateField(e.target);if(e.target.matches('[data-inspect]')){let key=e.target.dataset.inspect,what=e.target.dataset.aspect,d=ui.acq.draft;d.inspection[key]=d.inspection[key]||{};d.inspection[key][what]=e.target.value;}});
document.addEventListener('change',e=>{if(ui.page!=='acquisitions')return;let t=e.target;if(t.id==='ac-filter'){ui.acq.filter=t.value;render()}else if(t.id==='ac-sort'){ui.acq.sort=t.value;render()}else if(t.matches('[data-compare]')){let id=t.dataset.compare;ui.acq.compare=t.checked?[...new Set([...ui.acq.compare,id])].slice(-4):ui.acq.compare.filter(x=>x!==id);render()}else if(t.matches('[data-afield]')&&!get('ac-criteria')?.contains(t)){updateField(t);save(true)}else if(t.matches('[data-inspect]')){save(true);if(t.dataset.aspect==='status')render();}else if(t.matches('[data-task]')){ui.acq.draft.tasks[+t.dataset.task].done=t.checked;save(true)}else if(t.id==='ac-photo')addPhotos(t.files);});
document.addEventListener('submit',e=>{if(ui.page!=='acquisitions')return;const f=e.target;if(!f.id.startsWith('ac-'))return;e.preventDefault();if(!f.reportValidity())return;switch(f.id){case 'ac-reno':intakeForm(f,'renovationItems',q=>({title:q.title,quantity:val(q.quantity),amount:val(q.amount)}));break;case 'ac-comps':intakeForm(f,'comparables',q=>({address:q.address,date:q.date,price:val(q.price),size:val(q.size),adjustment:val(q.adjustment)}));break;case 'ac-offers':intakeForm(f,'offers',q=>({date:q.date,amount:val(q.amount),status:q.status,note:q.note}));break;case 'ac-scenarios':intakeForm(f,'scenarios',q=>({name:q.name,priceDelta:val(q.priceDelta),rateDelta:val(q.rateDelta),rentDelta:val(q.rentDelta),vacancyDelta:val(q.vacancyDelta),saleDelta:val(q.saleDelta),holdingDelta:val(q.holdingDelta),contingencyDelta:val(q.contingencyDelta)}));break;case 'ac-tasks':intakeForm(f,'tasks',q=>({date:q.date,task:q.task,done:false}));break;case 'ac-links':{const q=Object.fromEntries(new FormData(f));if(!/^https?:\/\//.test(q.url)){notify('Use an https:// link');return;}intakeForm(f,'links',x=>({title:x.title,url:x.url}));break;}case 'ac-criteria':{const q=Object.fromEntries(new FormData(f)),p=state.acquisitionPreferences;p.minimumScore=bounds(q.minimumScore,0,10);p.maxShortfall=nn(q.maxShortfall);p.defaultInterest=nn(q.defaultInterest);for(const k in p.weights)p.weights[k]=nn(q['weight_'+k]);persist();notify('Investment criteria saved');render();break;}}});
setup();render();window.PropertyAtlasAcquisitions={calculate,score,duty,maxOffer,forecast,seed,stressed};
